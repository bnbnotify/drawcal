[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drawcal"
version = "0.5.7"
description = "Python library for drawing simple monthly calendar images with events."
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
  {name = "Ryan Galloway", email = "ryan@rsgalloway.com"},
]
keywords = ["calendar", "image", "pillow", "png"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "Pillow>=10.0.0",
  "envstack>=0.8.3",
]

[project.optional-dependencies]
dev = [
  "black>=24.0.0",
  "build",
  "pytest>=8.0.0",
  "twine",
]

[project.urls]
Homepage = "https://github.com/bnbnotify/drawcal"
Repository = "https://github.com/bnbnotify/drawcal"

[project.scripts]
drawcal = "drawcal.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["lib"]

[tool.setuptools.package-dir]
"" = "lib"

[tool.setuptools.package-data]
drawcal = ["arial.ttf"]
